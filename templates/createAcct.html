                        </a>
                        <button type="button" id="backFromEmail" class="back-btn-header" onclick="closeEmailView()">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                width="16"
                                height="16"
                                fill="none"

                            </svg>
                            Back
                        </button>
                    </div>

                    <div class="top-right">
                        <a href="/login"
                           data-path="/login"
                           class="auth-link create-account-btn create-account">
                           Log In
                        </a>
                    </div>
                </div>

                <div id="auth-content">
                    <div>

                        <div class="spacing0nerster">
                            <h1 class="interger">Welcome to Gleyo</h1>
                        </div>

                        <p style="margin-bottom: 30px;">
                            Build with communities you care about — rewards follow naturally.
                        </p>

                        <fieldset class="email-fieldset" id="emailFieldset">
                            <legend id="legend">Enter address</legend>
                            <input type="email" id="aboutBox" name="box" placeholder="james@gmail.com">
                        </fieldset>

                        <p class="inavid-email"></p>

                        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

                        <button type="button" id="loginBtn" class="main-login-btn createacc">

                        <div class="lagelmm-s" style="margin-top: 22px;">

                            </label>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <aside class="auth-right" aria-hidden="true">
        <div class="auth-hero" style="--hero-img: url('https://picsum.photos/seed/gleyo-auth/1400/1800');">
            <div class="auth-hero-caption">
                <h2>Build a retention-first community</h2>
                <p>Build with communities you care about — rewards follow naturally.</p>
            </div>

    </aside>

</div>
