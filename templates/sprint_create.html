<style>
/* =======================
   GRADIENT EDGE TOKENS
======================= */
@property --edge-hi {
  syntax: '<color>';
  inherits: true;
  initial-value: rgba(255, 255, 255, 0.42);
}

@property --edge-lo {
  syntax: '<color>';
  inherits: true;
  initial-value: rgba(255, 255, 255, 0.05);
}

:root {
  --edge-hi: rgba(255, 255, 255, 0.42);
  --edge-lo: rgba(255, 255, 255, 0.05);
  --edge-w: 1px;
}

@media (min-resolution: 2dppx) {
  :root { --edge-w: 0.75px; }
}

/* Shared edge: element needs an OPAQUE --edge-fill */
.form-group input:not([type="hidden"]),
.form-group textarea,
.picker-box,
.reward-choice,
.reward-option,
.form-buttons #cancelBtn,
.form-buttons #saveBtn {
  border: var(--edge-w) solid transparent !important;
  background:
    linear-gradient(var(--edge-fill), var(--edge-fill)) padding-box,
    linear-gradient(
      135deg,
      var(--edge-hi) 0%,
      var(--edge-lo) 28%,
      var(--edge-lo) 72%,
      var(--edge-hi) 100%
    ) border-box !important;
  transition: --edge-hi .2s ease, --edge-lo .2s ease, background-color .2s ease, transform .08s ease;
}

/* =======================
   FORM STYLING
======================= */
.form-group input, .form-group textarea {
  --edge-fill: var(--bg-sidebar);
  color: var(--text-main);
  width: 100%;
  padding: 12px 14px;
  resize: none;
  font-size: 14px;
  border-radius: 16px;
  outline: none;
}

.form-group { margin-bottom: 22px; }

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 6px;
  color: var(--text-main);
}

.form-label .optional {
  font-size: 11px;
  color: var(--text-muted);
  margin-left: 6px;
}

input,
textarea {
  width: 100%;
  background: var(--bg-app);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  color: var(--text-main);
  outline: none;
  transition: border 0.15s ease, background 0.15s ease;
}

input::placeholder,
textarea::placeholder { color: var(--text-muted); }

textarea { min-height: 96px; resize: vertical; }

.form-group input:not([type="hidden"]):hover,
.form-group textarea:hover,
.picker-box:hover {
  --edge-hi: rgba(255, 255, 255, 0.6);
}

.form-group input:not([type="hidden"]):focus,
.form-group textarea:focus,
.picker-box:focus-within {
  --edge-hi: rgba(72, 136, 240, 0.9);
  --edge-lo: rgba(72, 136, 240, 0.2);
}

.form-group small {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  color: var(--text-muted);
}

.save-btn {
  background: #6366f1;
  border: none;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  padding: 10px 16px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s ease, transform 0.05s ease;
}
.save-btn:hover { background: #5558e8; }

.form-group input[type="number"]::-webkit-inner-spin-button,
.form-group input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.form-group input[type="number"] {
  -moz-appearance: textfield;
  appearance: textfield;
}

.form-group textarea { height: 90px; }

.form-group label {
  font-size: 13px;
  font-weight: 550;
  color: var(--text-main);
  margin-bottom: 9px;
  opacity: 0.9;
}

.sprint-wrapper h2 {
  color: var(--text-main);
  font-size: 18px;
}

.sprint-wrapper {
  width: 100%;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overflow-x: hidden;
  gap: 20px;
  padding-bottom: 0 !important;

  background-color: var(--bg-sidebar);
  padding: 12px 16px;
  height: 100%;
  padding-top: 30px !important;
  border-radius: 30px;
  border: 0.9px solid var(--border);
}

/* =======================
   DATE PICKER BOXES
======================= */
.picker-box {
  --edge-fill: var(--bg-surface);
  display: inline-flex;
  border-radius: 30px;
  gap: 10px;
  color: var(--text-main);
  opacity: 0.9;
  padding: 21px 19px;
}

.form-group .picker-box input {
  padding: 0;
  margin: 0;
  background: transparent !important;
  font-size: 14px;
  border: none !important;
  border-radius: 0;
}

.picker-box svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}

.timezone-label {
  display: inline-flex;
  font-size: 13px;
  color: var(--text-main);
  margin: 0;
  padding: 0;
  padding-left: 13px;
  margin-top: 4px !important;
  margin-bottom: 20px;
}

.picker-box-con { display: flex; flex-direction: column; }
.form-group.date { margin-bottom: 20px; }
.form-group.column { display: flex; flex-direction: column; }

.optional {
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
  margin-left: 10px;
}

/* =======================
   COLOR PICKER
======================= */
.orion-toggle-btn {
  background: transparent;
  border: none;
  outline: none;
  padding: 0;
  cursor: pointer;
}

.orion-toggle-btn img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}

.orion-toggle-btn:hover img { transform: scale(1.1); }

.orion-dropdown-wrapper { position: relative; }

.orion-dropdown-panel {
  position: fixed;
  z-index: 1000;

  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 24px;
  padding: 20px 30px;
  width: 300px;
  padding-top: 30px !important;
  backdrop-filter: blur(14px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);

  opacity: 0;
  pointer-events: none;
  transform: translateY(-6px);
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.orion-dropdown-panel.is-open {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.orion-color-row {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.orion-color-row:last-of-type {
  border-bottom: none;
  margin-bottom: 20px;
}

.orion-swatch {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 0 999px rgba(0, 0, 0, 0.253);
  border: 1px solid rgba(37, 12, 12, 0.05);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.orion-swatch:hover {
  transform: scale(1.12);
  box-shadow: inset 0 0 0 999px rgba(0, 0, 0, 0.2);
  border-color: #fff;
}

.orion-swatch::after {
  content: attr(data-color);
  position: absolute;
  bottom: -22px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 4px;
  color: #aaa;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.orion-swatch:hover::after { opacity: 1; }

.orion-preview {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid (data-color);
  background-color: var(--sprint-color);
  box-shadow: inset 0 0 0 999px rgba(0, 0, 0, 0.253);
  margin: 0 auto 16px;
  margin-top: 2cqmin !important;
  transition: background-color 0.2s ease;
}

.orion-confirm-btn {
  background-color: #4080e7d3;
  border: none;
  color: white;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  width: 100%;
  transition: background-color 0.2s ease;
}
.orion-confirm-btn:hover { background-color: #2f6de0; }

.orion-hashtag-group {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: -10px;
  margin-bottom: 20px;
  gap: 8px;
}

.orion-hashtag-icon {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background-color: var(--bg-surface);
  color: #fff;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: background-color 0.2s ease, transform 0.2s ease;
}

.orion-hashtag-icon:hover {
  background-color: #3a3a55;
  transform: scale(1.1);
}

.orion-text-input {
  display: none;
  border: 1px solid var(--border);
  background-color: var(--bg-surface);
  color: #fff;
  border-radius: 8px;
  padding: 6px 10px;
  outline: none !important;
  width: 100px;
  font-size: 13px;
}
.orion-text-input:focus { border-color: #2f6de0; }

.orion-eyedropper-icon {
  width: 22px;
  height: 22px;
  cursor: pointer;
  filter: invert(1);
  opacity: 0.7;
  transition: opacity 0.2s ease;
}
.orion-eyedropper-icon:hover { opacity: 1; }

.reward-card h3 {
  font-size: 14px !important;
  color: var(--text-main) !important;
  font-weight: 550;
  margin-bottom: 12px !important;
  margin: 0;
}

.reward-card div {
  color: var(--text-muted) !important;
  font-size: 14px !important;
  padding-left: 10px;
  margin: 0 !important;
}

/* =======================
   ACTION BUTTONS
======================= */
.form-actions-wrapper {
  position: sticky;
  bottom: 0;
  padding: 5px 4px;
  padding-bottom: 7px !important;
  background: var(--bg-sidebar);
}

.form-actions-wrapper button, .form-actions-wrapper a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 600;
  background: transparent;
  cursor: pointer;
  margin-top: 10px !important;
  transition:
    background-color 0.2s ease,
    border-color 0.2s ease,
    color 0.2s ease,
    box-shadow 0.2s ease,
    transform 0.08s ease;
}

.form-actions-wrapper button:active { transform: scale(0.97); }

.form-actions-wrapper button:focus-visible,
.form-actions-wrapper a:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
}

.form-buttons {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.form-buttons #cancelBtn {
  --edge-fill: #25253b;
  color: var(--text-main);
  text-decoration: none;
}

.form-buttons #cancelBtn:hover {
  --edge-hi: rgba(255, 255, 255, 0.6);
  --edge-fill: #212135;
}

.form-buttons #saveBtn {
  --edge-fill: #3f7ae0;
  --edge-hi: rgba(160, 200, 255, 0.85);
  --edge-lo: rgba(160, 200, 255, 0.12);
  color: rgba(255, 255, 255, 0.92);
  box-shadow: 0 3px 10px rgba(63, 122, 224, 0.22);
}

.form-buttons #saveBtn:hover {
  --edge-fill: #366fd1;
  box-shadow: 0 5px 14px rgba(63, 122, 224, 0.3);
}

/* SAVE BUTTON: disabled state (until the form is valid) */
.form-buttons #saveBtn.disable,
.form-buttons #saveBtn:disabled {
  --edge-fill: #354168;
  --edge-hi: rgba(255, 255, 255, 0.12);
  --edge-lo: rgba(255, 255, 255, 0.04);
  color: rgba(255, 255, 255, 0.4);
  box-shadow: none;
  opacity: 0.6;
  cursor: not-allowed;
}

.form-buttons #saveBtn.disable:hover,
.form-buttons #saveBtn:disabled:hover {
  --edge-fill: #354168;
  --edge-hi: rgba(255, 255, 255, 0.12);
  box-shadow: none;
}

.form-actions-wrapper button.disable:active,
.form-actions-wrapper button:disabled:active {
  transform: none;
}

@media (max-width: 767px) {
  .form-actions-wrapper button { padding: 13px 24px !important; }
}

/* =======================
   REWARD DISTRIBUTION
======================= */
.reward-option {
  --edge-fill: var(--bg-sidebar);
  border-radius: 24px;
  padding: 18px 20px 12px;
  margin-top: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.reward-legend {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 4px;
}

/* tier slot: height animated by RewardTiers (never display:none) */
.distribution-slot {
  height: 0;
  margin: -10px 0 0;
  opacity: 0;
  overflow: hidden;
  visibility: hidden;
  pointer-events: none;
  transition:
    height .32s cubic-bezier(.4, 0, .2, 1),
    margin .32s cubic-bezier(.4, 0, .2, 1),
    opacity .2s ease,
    visibility 0s linear .32s;
}

.distribution-slot.is-open {
  margin: 0 0 10px;
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition:
    height .32s cubic-bezier(.4, 0, .2, 1),
    margin .32s cubic-bezier(.4, 0, .2, 1),
    opacity .28s ease .05s,
    visibility 0s;
}

.distribution-slot .tier-box {
  padding: 4px 0 0;
  border: none !important;
  background: transparent !important;
  border-radius: 0;
}

/* =======================
   REWARDS TEXT (conditional)
   Opens ONLY when "Self distribution" is selected.
   Controlled by JS (initRewardsVisibility) through the .is-open class.
   Hidden for: nothing picked, Platform distribution, and the paid/Gleyo branch.
======================= */
.rewards-collapse {
  display: grid;
  grid-template-rows: 0fr;
  margin-top: -20px;           /* cancels the .sprint-wrapper gap while closed */
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition:
    grid-template-rows .32s cubic-bezier(.4, 0, .2, 1),
    margin .32s cubic-bezier(.4, 0, .2, 1),
    opacity .2s ease,
    visibility 0s linear .32s;
}

.rewards-collapse > .rewards-inner {
  min-height: 0;
  overflow: hidden;
}

.rewards-collapse.is-open {
  grid-template-rows: 1fr;
  margin-top: 0;
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition:
    grid-template-rows .32s cubic-bezier(.4, 0, .2, 1),
    margin .32s cubic-bezier(.4, 0, .2, 1),
    opacity .28s ease .05s,
    visibility 0s;
}

@media (prefers-reduced-motion: reduce) {
  .distribution-slot,
  .distribution-slot.is-open,
  .rewards-collapse,
  .rewards-collapse.is-open {
    transition: none;
  }
}

/* =======================
   RADIO CARDS
======================= */
.reward-choice {
  --edge-fill: var(--bg-surface);
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  border-radius: 18px;
  cursor: pointer;
}

.reward-choice:hover { --edge-hi: rgba(255, 255, 255, 0.6); }

.reward-choice input[type="radio"] {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.reward-choice::before {
  content: "";
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  margin-top: 2px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  transition: all 0.18s ease;
}

.reward-choice:has(input[type="radio"]:checked) {
  --edge-fill: #232341;
  --edge-hi: rgba(72, 136, 240, 0.9);
  --edge-lo: rgba(72, 136, 240, 0.2);
}

.reward-choice:has(input[type="radio"]:checked)::before {
  border-color: #4285f4;
  background-color: #4285f4;
  box-shadow: inset 0 0 0 4px #0f0f1ad9;
}

.choice-content {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.choice-content strong {
  font-size: 13px !important;
  color: var(--text-main);
  opacity: 0.95;
}

.choice-content span {
  font-size: 12.5px !important;
  color: var(--text-main);
  opacity: 0.7;
}
</style>
