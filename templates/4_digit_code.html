<title>OTP Verification</title>
<meta name="csrf-token" content="{{ csrf_token() }}">

<style>

  .container.otp-container {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    text-align: center;
    padding-bottom: max(28px, env(safe-area-inset-bottom));
  }

  .otp-header {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    margin-bottom: 40px;
  }

  .otp-logo {
    display: flex;
    align-items: center;
  }

  .otp-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding-bottom: 40px;
    animation: otpIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes otpIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .otp-icon {
    position: relative;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    margin: 0 auto 22px;
    border: var(--edge-w) solid transparent;
    color: #a5b4fc;
    background:
      linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.02)),
      var(--bg-hover-hover-plain);
    box-shadow:
      0 10px 30px rgba(99, 102, 241, 0.18),
      inset 0 1px 0 rgba(255, 255, 255, 0.14);
  }

  /* shared liquid-glass gradient edge */
  .otp-icon::before,
  .otp-container .resend_link::before {
    content: "";
    position: absolute;
    inset: calc(var(--edge-w) * -1);
    padding: var(--edge-w);
    border-radius: inherit;
    background: linear-gradient(
      135deg,
      var(--edge-hi) 0%,
      var(--edge-lo) 28%,
      var(--edge-lo) 72%,
      var(--edge-hi) 100%
    );
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .pickmy {
    margin: 0 0 8px;
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .otp-container .otp-sub {
    margin: 0 0 28px;
    max-width: 340px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-muted);
  }

  .fire-pee {
    color: var(--text-main);
    font-weight: 500;
    text-decoration: none;
    overflow-wrap: anywhere;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
  }

  .otp-container form {
    width: 100%;
  }

  /* ----------------------- STATUS PILL (glass edge) ----------------------- */

  .resend-status {
    --st-hi: rgba(255, 255, 255, 0.6);
    --st-lo: rgba(255, 255, 255, 0.08);
    --st-tint: rgba(255, 255, 255, 0.06);

    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: fit-content;
    min-height: 32px;
    margin: 0 auto 16px;
    padding: 0 14px;
    border-radius: 999px;
    background: var(--st-tint);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity 0.4s ease, transform 0.4s ease, color 0.25s ease, background 0.25s ease;
    pointer-events: none;
  }

  .resend-status::before {
    content: "";
    position: absolute;
    inset: calc(var(--edge-w) * -1);
    padding: var(--edge-w);
    border-radius: inherit;
    background: linear-gradient(
      135deg,
      var(--st-hi) 0%,
      var(--st-lo) 28%,
      var(--st-lo) 72%,
      var(--st-hi) 100%
    );
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .resend-status.show {
    opacity: 1;
    transform: translateY(0);
  }

  .resend-status svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .resend-status.sent {
    color: #4ade80;
    --st-hi: rgba(74, 222, 128, 0.85);
    --st-lo: rgba(74, 222, 128, 0.10);
    --st-tint: rgba(74, 222, 128, 0.08);
  }

  .resend-status.wait {
    color: #ff9b9b;
    --st-hi: rgba(255, 155, 155, 0.85);
    --st-lo: rgba(255, 155, 155, 0.10);
    --st-tint: rgba(255, 155, 155, 0.08);
  }

  /* ----------------------- CODE BOXES ----------------------- */

  .code-boxes {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
    border: none;
  }

  .code-input {
    --box-fill: var(--field-fill);
    flex: 0 1 52px;
    width: 52px;
    min-width: 0;
    height: 58px;
    text-align: center;
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--text-main);
    caret-color: #fff;
    outline: none;
    border: var(--edge-w) solid transparent;
    border-radius: 16px;
    background:
      linear-gradient(var(--box-fill), var(--box-fill)) padding-box,
      linear-gradient(
        135deg,
        var(--edge-hi) 0%,
        var(--edge-lo) 28%,
        var(--edge-lo) 72%,
        var(--edge-hi) 100%
      ) border-box;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    transition: --edge-hi 0.25s ease, --edge-lo 0.25s ease, box-shadow 0.25s ease;
  }

  .code-input:hover {
    --edge-hi: rgba(255, 255, 255, 0.6);
  }

  .code-input:valid {
    --edge-hi: rgba(255, 255, 255, 0.75);
    --edge-lo: rgba(255, 255, 255, 0.12);
  }

  .code-input:focus {
    --edge-hi: #4285f4;
    --edge-lo: rgba(255, 255, 255, 0.06);
    box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.12);
  }

  .code-input.error {
    --edge-hi: rgba(254, 41, 41, 0.95);
    --edge-lo: rgba(255, 255, 255, 0.06);
    --box-fill: #241217;
    box-shadow: none;
    animation: shake 0.3s ease;
  }

  @keyframes shake {
    0%   { transform: translateX(0); }
    25%  { transform: translateX(-4px); }
    50%  { transform: translateX(4px); }
    75%  { transform: translateX(-4px); }
    100% { transform: translateX(0); }
  }

  /* ----------------------- RESEND BUTTON ----------------------- */

  .resend-line {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text-muted);
  }

  .otp-container .resend_link {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 76px;   /* keeps width stable when swapping text <-> spinner */
    height: 36px;      /* keeps height stable too */
    padding: 0 16px;
    border: var(--edge-w) solid transparent;
    border-radius: 999px;
    background: var(--bg-hover-hover-plain);
    color: var(--text-main);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease,
                --edge-hi 0.2s ease, --edge-lo 0.2s ease;
  }

  .otp-container .resend_link svg {
    width: 16px;
    height: 16px;
    display: block;
  }

  .otp-container .resend_link:hover {
    color: #fff;
    background: var(--accent-color);
    transform: translateY(-1px);
    --edge-hi: rgba(255, 255, 255, 0.75);
    --edge-lo: rgba(255, 255, 255, 0.08);
  }

  .otp-container .resend_link:active {
    transform: translateY(0);
  }

  .otp-container .resend_link.loading {
    pointer-events: none;
    color: #fff;
    background: var(--accent-color);
  }

  .otp-container .resend_link.disabled,
  .otp-container .resend_link[aria-disabled="true"] {
    opacity: 0.5;
    pointer-events: none;
  }

  /* ----------------------- FOOTER ----------------------- */

  .otp-footer {
    position: relative;
    margin-top: auto;
    padding-top: 22px;
  }

  .otp-footer::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: var(--edge-w);
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
  }

  .otp-footer .terms-label {
    text-align: center;
  }

  .nester {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 14px;
    background: var(--accent-color);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .nester:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px var(--accent-45);
  }

  @media (max-width: 767px) {
    .code-boxes {
      gap: 8px;
    }

    .code-input {
      flex-basis: 44px;
      width: 44px;
      height: 52px;
      font-size: 20px;
      border-radius: 14px;
    }
  }
</style>

<div class="container otp-container">

  <div class="otp-main">

    <div class="otp-icon">
      <svg viewBox="-0.5 0 25 25" width="28" height="28"  fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9.00977 21.39H19.0098C20.0706 21.39 21.0881 20.9685 21.8382 20.2184C22.5883 19.4682 23.0098 18.4509 23.0098 17.39V7.39001C23.0098 6.32915 22.5883 5.31167 21.8382 4.56152C21.0881 3.81138 20.0706 3.39001 19.0098 3.39001H7.00977C5.9489 3.39001 4.93148 3.81138 4.18134 4.56152C3.43119 5.31167 3.00977 6.32915 3.00977 7.39001V12.39" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1.00977 18.39H11.0098" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1.00977 15.39H5.00977" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22.209 5.41992C16.599 16.0599 9.39906 16.0499 3.78906 5.41992" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="pickmy">OTP Verification</h1>
    <p class="otp-sub">Please enter the 6-digit code sent to <u class="fire-pee">{{ email }}</u>.</p>

    <form onsubmit="return false;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div id="resendStatus" class="resend-status"></div>

      <div class="code-boxes">
        <input name="digit1" class="code-input" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required>
        <input name="digit2" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" required>
        <input name="digit3" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" required>
        <input name="digit4" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" required>
        <input name="digit5" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" required>
        <input name="digit6" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" required>
      </div>
    </form>

    <div class="resend-line">
      <span>Didn't receive a code?</span>
      <div id="resendBtn" class="resend_link" role="button" tabindex="0">Resend</div>
    </div>

  </div>

  <div class="otp-footer">
    <label class="terms-label">
      By continuing, you acknowledge you've read and agreed to our
      <a href="{{ url_for('terms') }}" target="_blank" class="link-terms">Terms of Service</a> &
      <a href="{{ url_for('privacy') }}" target="_blank" class="link-terms">Privacy Policy</a>
    </label>
  </div>

</div>
