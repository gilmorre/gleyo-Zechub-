<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <link rel="shortcut icon" href="https://zupdpwnloewdkjqsymdm.supabase.co/storage/v1/object/public/uploads/communities/7/logos/511f4996-5748-4f1f-b74c-5d5c33f7124c.png">

    <title>Set Passcode</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='heritic.css') }}?v=1">

    <style>
      #card {
        --pc-text: #e5e7eb;
        --pc-muted: #bbbfc7;
        --pc-label: rgba(229, 231, 235, 0.38);
        --pc-accent: #a5b4fc;
        --dot-empty: rgba(255, 255, 255, 0.16);
        --dot-filled: #e5e7eb;
        --dot-error: #ff5a6e;
        --dot-success: #4ade80;
        --key-fill: #161623;
        --key-size: clamp(62px, 10vh, 78px);
        --key-gap-x: 22px;
        --key-gap-y: clamp(14px, 2.2vh, 20px);

        position: relative;
        width: 100%;
        max-width: 400px;
        min-height: 100vh;
        min-height: 100dvh;
        margin: auto;
        padding: 48px 24px calc(40px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'DM Sans', sans-serif;
        color: var(--pc-text);
        background: transparent;
        border: none;
        box-shadow: none;
        animation: pcIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes pcIn {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      #card .lock-icon {
        position: relative;
        flex-shrink: 0;
        width: 60px;
        height: 60px;
        margin-bottom: 26px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: var(--edge-w, 1px) solid transparent;
        color: var(--pc-accent);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.02)),
          var(--bg-hover-hover-plain, #232339);
        box-shadow:
          0 10px 30px rgba(99, 102, 241, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
      }

      #card .lock-icon::before {
        content: "";
        position: absolute;
        inset: calc(var(--edge-w, 1px) * -1);
        padding: var(--edge-w, 1px);
        border-radius: inherit;
        background: linear-gradient(
          135deg,
          var(--edge-hi) 0%,
          var(--edge-lo) 28%,
          var(--edge-lo) 72%,
          var(--edge-hi) 100%
        );
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      #card .lock-icon svg {
        width: 30px;
        height: 30px;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      #card .lock-icon.shake svg { animation: shake 0.4s ease; }
      #card .lock-icon.unlock svg { animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }

      @keyframes shake {
        0%, 100% { transform: translateX(0) rotate(0deg); }
        15% { transform: translateX(-6px) rotate(-4deg); }
        30% { transform: translateX(6px) rotate(4deg); }
        45% { transform: translateX(-4px) rotate(-2deg); }
        60% { transform: translateX(4px) rotate(2deg); }
        75% { transform: translateX(-2px) rotate(-1deg); }
      }

      @keyframes popIn {
        0%   { transform: scale(0.7); opacity: 0.4; }
        60%  { transform: scale(1.15); }
        100% { transform: scale(1); opacity: 1; }
      }

      #card .step-label {
        margin-bottom: 14px;
        font-family: 'DM Sans', sans-serif;
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--pc-label);
        transition: opacity 0.3s;
      }

      #card .title {
        margin-bottom: 12px;
        font-family: 'Syne', sans-serif;
        font-size: 28px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.3px;
        text-align: center;
        color: var(--pc-text);
      }

      #card .subtitle {
        min-height: 22px;
        max-width: 300px;
        margin-bottom: 36px;
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        line-height: 1.6;
        text-align: center;
        color: var(--pc-muted);
        transition: color 0.3s;
      }

      #card .subtitle.error   { color: var(--dot-error); }
      #card .subtitle.success { color: var(--dot-success); }

      #card .dots {
        display: flex;
        gap: 18px;
        margin-bottom: 44px;
      }

      #card .dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1.5px solid var(--dot-empty);
        background: transparent;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.18s ease;
      }

      #card .dot.filled {
        background: var(--dot-filled);
        border-color: var(--dot-filled);
        transform: scale(1.15);
        box-shadow: 0 0 10px rgba(229, 231, 235, 0.3);
      }

      #card .dot.error {
        background: var(--dot-error);
        border-color: var(--dot-error);
        box-shadow: 0 0 10px rgba(255, 90, 110, 0.4);
        transform: scale(1);
      }

      #card .dot.success {
        background: var(--dot-success);
        border-color: var(--dot-success);
        box-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
        transform: scale(1.15);
      }

      #card .dot.pulse { animation: dotPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }

      @keyframes dotPop {
        0%   { transform: scale(1); }
        50%  { transform: scale(1.45); }
        100% { transform: scale(1.15); }
      }

      #card .dots.error-shake { animation: dotsShake 0.35s ease; }

      @keyframes dotsShake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-8px); }
        40% { transform: translateX(8px); }
        60% { transform: translateX(-5px); }
        80% { transform: translateX(5px); }
      }

      #card .pad {
        display: grid;
        grid-template-columns: repeat(3, var(--key-size));
        justify-content: center;
        column-gap: var(--key-gap-x);
        row-gap: var(--key-gap-y);
      }

      #card .key {
        --edge-hi: rgba(255, 255, 255, 0.42);
        --edge-lo: rgba(255, 255, 255, 0.05);

        position: relative;
        width: var(--key-size);
        height: var(--key-size);
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        color: var(--pc-text);
        border: var(--edge-w, 1px) solid transparent;
        border-radius: 50%;
        background:
          linear-gradient(var(--key-fill), var(--key-fill)) padding-box,
          linear-gradient(
            135deg,
            var(--edge-hi) 0%,
            var(--edge-lo) 28%,
            var(--edge-lo) 72%,
            var(--edge-hi) 100%
          ) border-box;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        transition: transform 0.1s ease, --edge-hi 0.2s ease, --edge-lo 0.2s ease;
      }

      #card .key:hover {
        --key-fill: #1e1e30;
        --edge-hi: rgba(255, 255, 255, 0.7);
        --edge-lo: rgba(255, 255, 255, 0.08);
      }

      #card .key:active,
      #card .key.pressed {
        --key-fill: #2c2c4a;
        --edge-hi: #818cf8;
        --edge-lo: rgba(255, 255, 255, 0.08);
        transform: scale(0.94);
      }

      #card .key:focus-visible {
        outline: 2px solid #a5b4fc;
        outline-offset: 3px;
      }

      #card .key-num {
        font-family: 'Syne', sans-serif;
        font-size: 26px;
        font-weight: 600;
        line-height: 1;
        color: var(--pc-text);
      }

      #card .key-letters {
        margin-top: 4px;
        font-family: 'DM Sans', sans-serif;
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.14em;
        color: var(--pc-label);
      }

      #card .key.del .key-num {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--pc-muted);
      }

      #card .key.zero { grid-column: 2; }

      #card #hidden-input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        width: 1px;
        height: 1px;
      }

      #card .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(165, 180, 252, 0.22);
        transform: scale(0);
        animation: ripple 0.4s linear;
        pointer-events: none;
      }

      @keyframes ripple {
        to { transform: scale(3); opacity: 0; }
      }

      #card .success-overlay {
        position: absolute;
        inset: 0;
        background: rgba(74, 222, 128, 0.04);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s;
      }

      #card .success-overlay.show { opacity: 1; }

      @media (max-width: 480px) {
        #card { padding: 40px 20px calc(36px + env(safe-area-inset-bottom)); }
        #card .lock-icon { margin-bottom: 22px; }
        #card .title { font-size: 26px; }
        #card .subtitle { margin-bottom: 30px; }
        #card .dots { margin-bottom: 38px; }
      }
    </style>
</head>
<body>

<div class="auth-split">

    <div class="auth-left">
        <div class="login-container" id="innerconntect">

            <div class="card" id="card" data-initerme="{{ next_url or '' }}">
              <div class="success-overlay" id="successOverlay"></div>

              <div class="lock-icon" id="lockIcon">
                <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" id="lockSvg">
                  <rect x="10" y="24" width="32" height="22" rx="5" fill="rgba(165,180,252,0.14)" stroke="currentColor" stroke-width="2.2"/>
                  <path id="shackle" d="M17 24V17a9 9 0 0118 0v7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                  <circle cx="26" cy="35" r="3.5" fill="currentColor"/>
                  <line x1="26" y1="38" x2="26" y2="42" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
              </div>

              <div class="step-label" id="stepLabel">Step 1 of 2</div>
              <div class="title" id="title">Set a Passcode</div>
              <div class="subtitle" id="subtitle">Enter 6 digits to secure your account</div>

              <div class="dots" id="dots">
                <div class="dot" data-i="0"></div>
                <div class="dot" data-i="1"></div>
                <div class="dot" data-i="2"></div>
                <div class="dot" data-i="3"></div>
                <div class="dot" data-i="4"></div>
                <div class="dot" data-i="5"></div>
              </div>

              <div class="pad" id="pad">
                <button class="key" data-val="1"><span class="key-num">1</span></button>
                <button class="key" data-val="2"><span class="key-num">2</span><span class="key-letters">ABC</span></button>
                <button class="key" data-val="3"><span class="key-num">3</span><span class="key-letters">DEF</span></button>
                <button class="key" data-val="4"><span class="key-num">4</span><span class="key-letters">GHI</span></button>
                <button class="key" data-val="5"><span class="key-num">5</span><span class="key-letters">JKL</span></button>
                <button class="key" data-val="6"><span class="key-num">6</span><span class="key-letters">MNO</span></button>
                <button class="key" data-val="7"><span class="key-num">7</span><span class="key-letters">PQRS</span></button>
                <button class="key" data-val="8"><span class="key-num">8</span><span class="key-letters">TUV</span></button>
                <button class="key" data-val="9"><span class="key-num">9</span><span class="key-letters">WXYZ</span></button>
                <button class="key zero" data-val="0"><span class="key-num">0</span></button>
                <button class="key del" data-val="del"><span class="key-num">
                  <svg class="svg-icon" style="width: 23px;height: 23px;vertical-align: middle;fill: currentColor;overflow: hidden;" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg"><path d="M597.333333 451.669333l55.168-55.168a42.666667 42.666667 0 0 1 60.330667 60.330667L657.664 512l55.168 55.168a42.666667 42.666667 0 0 1-60.330667 60.330667L597.333333 572.330667l-55.168 55.168a42.666667 42.666667 0 0 1-60.330666-60.330667L537.002667 512l-55.168-55.168a42.666667 42.666667 0 0 1 60.330666-60.330667L597.333333 451.669333zM874.581333 832H376.32c-47.402667 0-106.730667-25.941333-138.752-60.672l-163.178667-176.938667c-42.325333-45.866667-42.346667-118.869333 0-164.778666l163.2-176.938667C269.525333 218.026667 329.045333 192 376.32 192h498.24A106.666667 106.666667 0 0 1 981.333333 298.837333v426.325334A106.752 106.752 0 0 1 874.581333 832z m0-85.333333C886.4 746.666667 896 737.088 896 725.162667V298.837333c0-11.946667-9.514667-21.504-21.418667-21.504H376.32c-23.466667 0-60.224 16.064-76.010667 33.194667l-163.2 176.917333c-12.181333 13.226667-12.16 35.882667 0 49.109334l163.2 176.917333C316.16 730.666667 352.746667 746.666667 376.32 746.666667h498.24z"/></svg>
                </span></button>
              </div>

              <input id="hidden-input" type="tel" maxlength="1" autocomplete="off"/>
            </div>

        </div>
    </div>

    <aside class="auth-right" aria-hidden="true">
        <div class="auth-hero" data-hero="secure" style="--hero-img: url('https://xpcqiovfesvllsljxhac.supabase.co/storage/v1/object/public/uploads/hero/4f93381e-063b-4626-b230-64d65167c2ce.jpg');">
            <div class="auth-hero-caption">
                <h2>Secure your account</h2>
                <p>A 6-digit passcode keeps your account and your rewards protected.</p>
            </div>
        </div>
    </aside>

</div>

<script src="{{ url_for('static', filename='loginoauth.js') }}"></script>
<script src="{{ url_for('static', filename='createpasscode.js') }}"></script>
</body>
</html>
