<style>
@property --edge-hi {
  syntax: '<color>';
  inherits: true;
  initial-value: rgba(255, 255, 255, 0.42);
}
@property --edge-lo {
  syntax: '<color>';
  inherits: true;
  initial-value: rgba(255, 255, 255, 0.05);
}

#twitter .linked-card {
  --edge-hi: rgba(255, 255, 255, 0.253);
  --edge-lo: rgba(255, 255, 255, 0.05);
  --edge-w: 1px;
}

.sub-tab-content {
  width: 470px;
}

#twitter {
  padding: 34px 10px 0;
  color: var(--text-main);
}

#twitter .linked-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 18px;
  background: var(--bg-surface);
  border: var(--edge-w) solid transparent;
  border-radius: var(--radius);
}

#twitter .linked-card img {
  width: 38px;
  height: 38px;
}

#twitter .linked-card span:first-of-type {
  font-weight: 600;
  font-size: 15px;
}

#twitter .linked-card::before {
  content: "";
  position: absolute;
  inset: 0;
  padding: var(--edge-w);
  border-radius: inherit;
  background: linear-gradient(
    135deg,
    var(--edge-hi) 0%,
    var(--edge-lo) 28%,
    var(--edge-lo) 72%,
    var(--edge-hi) 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

#twitter .buttos {
  margin-left: auto;
  padding: 8px 14px;
  background: rgba(29, 155, 240, 0.85);
  color: #fff;
  border-radius: 10px;
  font-size: 14px;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.2s ease;
}

#twitter .buttos:hover {
  background: #1a8cd8;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.55);
  z-index: 9999;
}

.modal-backdrop.show {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 420px;
  padding: 22px;
  background: var(--bg-surface);
  border-radius: 16px;
}

.modal-card h4 {
  margin: 0 0 8px;
  font-size: 16px;
  color: #fff;
}

.modal-card p {
  margin: 0 0 18px;
  font-size: 14px;
  color: var(--text-muted);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

@media (min-width: 768px) {
  #twitter {
    padding: 34px 20px 20px;
  } 
}

@media (max-width: 768px) {

  .sub-tab-content {
    max-width: 100%;
    width: 100%;
  }
}


@media (min-resolution: 2dppx) {
  #twitter .linked-card {
    --edge-w: 0.75px;
  }
}
</style>

<div class="sub-tab-content" id="twitter">
  {% if community.twitter_account and community.twitter_account.action == "connected" %}
    <p style="color:#22c55e">Twitter connected successfully.</p>
    <div class="linked-card">
      <img src="https://cdn-icons-png.flaticon.com/128/5969/5969020.png" alt="Twitter">
      <span>Twitter</span>
      <a href="hj" class="buttos">Disconnect</a>
    </div>
  {% else %}
    <p>Connect your Twitter to verify your social presence.</p>
    <div class="linked-card">
      <img src="https://cdn-icons-png.flaticon.com/128/5969/5969020.png" alt="Twitter">
      <span>Twitter</span>
      <a href="{{ url_for('community_twitter.community_twitter_login', community_id=community.id, next=url_for('settings_integrations_twitter', community_slug=community.slug)) }}" class="buttos">
        Connect
      </a>
    </div>
  {% endif %}
</div>
