<html lang="en">
<head>

  <meta name="description" content="Official Gleyo links: website, partnerships and Telegram.">
  <link rel="shortcut icon" href="https://zupdpwnloewdkjqsymdm.supabase.co/storage/v1/object/public/uploads/communities/7/logos/511f4996-5748-4f1f-b74c-5d5c33f7124c.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@600&display=swap" rel="stylesheet">
  <style>
    @property --edge-hi {
      syntax: '<color>';
      inherits: true;
      initial-value: rgba(255, 255, 255, 0.42);
    }
    @property --edge-lo {
      syntax: '<color>';
      inherits: true;
      initial-value: rgba(255, 255, 255, 0.05);
    }

    :root {
      --text-main: #e5e7eb;
      --text-muted: #bbbfc7;
      --accent-color: #6366f1;
      --bg-hover-hover-plain: #232339;
      --bg-hover-hover: #2a2a449c;
      --bg-hover-hover-init-q-qq: #161623;
      --edge-hi: rgba(255, 255, 255, 0.42);
      --edge-lo: rgba(255, 255, 255, 0.05);
      --edge-w: 1px;
    }

    @media (min-resolution: 2dppx) {
      :root { --edge-w: 0.75px; }
    }

    * {
      -webkit-text-size-adjust: 100% !important;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: radial-gradient(circle at 30% 20%, #151528 0%, #0b0b12 60%);
      color: var(--text-main);
      font-family: 'DM Sans', sans-serif;
    }

    /* ---------- Page layout ---------- */
    .links-page {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .links-scroll {
      flex: 1 1 100%;
      min-width: 0;
      display: flex;
      overflow-y: auto;
    }

    .links-wrap {
      margin: auto;
      width: 100%;
      max-width: 400px;
      padding: 24px 20px 100px;
      text-align: center;
    }

    /* ---------- Hero (tablet and larger) ---------- */
    .links-hero {
      display: none;
      position: relative;
      overflow: hidden;
      flex: 1 1 70%;
      min-width: 0;
      margin: 16px 16px 16px 0;
      border-radius: 28px;
      border: var(--edge-w) solid rgba(255, 255, 255, 0.10);
      background: radial-gradient(circle at 30% 20%, #2a2a55 0%, #161623 70%);
    }

    .links-hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      -webkit-user-drag: none;
      user-select: none;
    }

    .links-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(11, 11, 18, 0) 40%,
        rgba(11, 11, 18, 0.85) 100%
      );
      pointer-events: none;
    }

    .links-hero-caption {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 1;
      padding: 40px;
      text-align: left;
    }

    .links-hero-caption h2 {
      font-family: 'Syne', sans-serif;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.3px;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .links-hero-caption p {
      max-width: 420px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    @media (min-width: 768px) {
      .links-scroll { flex: 1 1 50%; }
      .links-hero { display: block; }
    }

    /* ---------- Content ---------- */
    .links-logo {
      display: block;
      width: 52px; height: 52px;
      border-radius: 20px;
      object-fit: cover;
      margin: 0 auto 16px;
      -webkit-user-drag: none;
      user-select: none;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }

    .links-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }

    .link-list { display: flex; flex-direction: column; gap: 10px; }

    .link-card {
      position: relative;
      display: flex; align-items: center; gap: 12px;
      padding: 8px 14px;
      border: var(--edge-w) solid transparent;
      border-radius: 26px;
      background: var(--bg-hover-hover-plain);
      color: var(--text-main);
      text-decoration: none;
      text-align: left;
      transition: background 0.2s ease, transform 0.2s ease,
                  --edge-hi 0.2s ease, --edge-lo 0.2s ease;
    }

    .link-card::before {
      content: "";
      position: absolute;
      inset: calc(var(--edge-w) * -1);
      padding: var(--edge-w);
      border-radius: inherit;
      background: linear-gradient(
        135deg,
        var(--edge-hi) 0%,
        var(--edge-lo) 28%,
        var(--edge-lo) 72%,
        var(--edge-hi) 100%
      );
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .link-card:hover {
      --edge-hi: rgba(255, 255, 255, 0.75);
      --edge-lo: rgba(255, 255, 255, 0.08);
      background: var(--bg-hover-hover);
      transform: translateY(-1px);
    }

    .link-card:active { transform: translateY(0); }

    .link-card:focus-visible {
      outline: 2px solid #a5b4fc;
      outline-offset: 2px;
    }

    .link-icon {
      flex: 0 0 28px; width: 28px; height: 28px; border-radius: 12px;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
    }

    .link-icon svg { width: 18px; height: 18px; stroke-linecap: round; stroke-linejoin: round; }

    .link-text { flex: 1; min-width: 0; }
    .link-text br { display: none; }
    .link-title, .link-desc { display: block; line-height: 1.25; }
    .link-title { font-size: 14px; font-weight: 600; }
    .link-desc {
      font-size: 12px; color: var(--text-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .link-arrow { color: var(--text-muted); font-size: 18px; line-height: 1; }
  </style>
</head>
